<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>درود و اذکار — ایک ایک کر کے</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000}
body{font-family:Tahoma,"Noto Naskh Arabic","Amiri",serif;color:#174b39}
.page{max-width:760px;margin:auto}
.sheet{
 min-height:100vh;background:#fff9e9;overflow:hidden;position:relative;
 border-left:7px solid #b88d25;border-right:7px solid #b88d25
}
.top{
 height:158px;position:relative;overflow:hidden;
 background:
 radial-gradient(circle at 10% 30%,#fff9cf 0 3px,transparent 4px),
 radial-gradient(circle at 88% 22%,#fff9cf 0 3px,transparent 4px),
 linear-gradient(#a9dce1,#f2dfad 66%,#d1b15e)
}
.top:before{
 content:"";position:absolute;left:-8%;right:-8%;bottom:-55px;height:120px;
 background:#275e4c;border-radius:50% 50% 0 0/45% 45% 0 0
}
.top:after{
 content:"☪";position:absolute;right:27px;top:12px;font-size:55px;color:#fff8d1
}
.mosques{position:absolute;z-index:2;left:0;right:0;bottom:0;text-align:center;
 color:#174b39;font-size:72px;letter-spacing:-16px;text-shadow:0 2px 1px #fff5c8}
.mainTitle{
 position:relative;z-index:4;margin:-12px 14% 0;
 padding:12px 20px;background:linear-gradient(#0a654b,#07513e);
 color:white;text-align:center;border:5px solid #c39a31;border-radius:34px;
 font-size:29px;font-weight:900;box-shadow:0 4px 0 #8d6b1d
}
.subTitle{
 position:relative;z-index:5;width:max-content;max-width:88%;margin:9px auto 12px;
 padding:6px 23px;background:#f1dfa3;border:3px solid #c5a03a;border-radius:22px;
 font-size:17px;font-weight:900;color:#244a38
}
.countBox{
 width:max-content;margin:0 auto 18px;background:#075a43;color:white;
 border:4px solid #c59e36;border-radius:27px;padding:7px 24px;
 font-size:25px;font-weight:900;box-shadow:0 4px 0 #8e6c1e;text-align:center;direction:rtl
}
.backBar{padding:10px 12px 0;text-align:center}
.backBtn{background:#fffdf5;color:#174b39;border:2px solid #b38a24;border-radius:17px;padding:8px 22px;font-size:16px;font-weight:900;box-shadow:0 2px 0 #8f6c1e}
.card{
 margin:0 12px;border:3px solid #b48a26;border-radius:28px;
 background:linear-gradient(145deg,#fffdf4,#fbefc8);padding:24px 14px 18px;
 box-shadow:inset 0 0 35px #b7954020;position:relative;min-height:60vh
}
.card:before,.card:after{position:absolute;top:10px;color:#c59b30;font-size:28px}
.card:before{content:"✦";right:16px}.card:after{content:"✦";left:16px}
.zikrHeader{
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 gap:8px;margin:0 auto 16px;text-align:center
}
.kind{
 width:max-content;margin:0 auto;padding:6px 30px;background:#075b43;color:#fff;
 border:3px solid #c49c34;border-radius:20px;font-size:20px;font-weight:900;
 box-shadow:0 3px 0 #8e6c1e
}
.arabic{
 font-family:"Amiri","Noto Naskh Arabic",serif;text-align:center;direction:rtl;
 color:#07543d;font-size:52px;line-height:2.0;font-weight:900;
 padding:0 8px 20px;border-bottom:2px solid #c8ae67
}
.word{display:inline-block;border-radius:7px;padding:0 2px;transition:.15s}
.word.done{color:#118747;background:#d7f0dc}
.word.current{background:#b9e8c7}
.translation{
 text-align:center;color:#222;font-size:22px;line-height:1.9;font-weight:700;
 padding:13px 8px 4px;min-height:92px
}
.translation:before{
 content:"اردو ترجمہ";display:block;width:max-content;margin:0 auto 7px;
 padding:3px 19px;background:#075b43;color:#fff;border:2px solid #c49c34;
 border-radius:18px;font-size:15px;font-weight:900
}
.status{text-align:center;min-height:40px;padding:11px 8px;font-size:16px;font-weight:700}
.buttons{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:0 8px 15px}
button{font-family:Tahoma;border:2px solid #b38a24;border-radius:17px;padding:11px 18px;
 font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 2px 0 #8f6c1e}
.start{background:#075b43;color:white}.listen{background:#f0dfa0;color:#174b39}
.next{background:#fffdf5;color:#111}.reset{background:#fffdf5;color:#111}
button:disabled{opacity:.45}
.bottomRibbon{
 margin:8px 12px 0;padding:8px;background:#075b43;color:#fff;text-align:center;
 border:3px solid #c49c34;border-radius:18px;font-size:14px;font-weight:bold
}
@media(max-width:600px){
 .top{height:120px}.mainTitle{font-size:24px;margin-left:9%;margin-right:9%}
 .subTitle{font-size:14px}.countBox{font-size:22px;margin-left:auto;margin-right:auto}
 .card{margin:0 6px;padding:21px 10px 14px;min-height:61vh}
 .zikrHeader{gap:6px;margin-bottom:12px}
 .kind{font-size:18px;padding:5px 28px}
 .countBox{font-size:21px;padding:6px 20px;margin-bottom:0}
 .arabic{font-size:38px;line-height:2.12}.translation{font-size:18px}
 button{font-size:15px;padding:10px 13px}
}
</style>
<style>
.firebasePanel{margin:12px 13px;padding:12px;border:2px solid #c49b34;border-radius:18px;background:#fffdf1;text-align:center}
.loginState{font-weight:800;font-size:15px;color:#174b39;line-height:1.8}
.myTotal{display:inline-block;margin-top:6px;background:#075a43;color:#fff;border:2px solid #c49b34;border-radius:16px;padding:5px 14px;font-weight:900}
.leaderTitle{display:inline-block;background:#075a43;color:#fff;border:2px solid #c49b34;border-radius:16px;padding:4px 18px;font-weight:900;margin:5px 0 8px}
.leaderboard{display:flex;flex-direction:column;gap:5px}
.leaderRow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 9px;border-radius:12px;background:#f5e9c5;border:1px solid #d4bd76;font-size:13px}
.leaderName{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;flex:1}
.leaderCount{font-weight:900;color:#075a43;white-space:nowrap}
.cloudHint{font-size:11px;color:#68756e;margin-top:6px}
</style>

</head>
<body>
<div class="page"><div class="sheet">
  <div class="top"><div class="mosques">♜♜♜♜♜♜♜</div></div>
  <div class="backBar"><button class="backBtn" id="backBtn">← واپس</button></div>
  <div class="mainTitle">روزانہ کے اذکار اور دعائیں</div>
  <div class="subTitle">اللہ کی یاد، سکونِ قلب</div>

  <main class="card">
    <div class="zikrHeader">
      <div class="kind" id="kind">ذکر</div>
      <div class="countBox" id="targetTop">100 مرتبہ باقی</div>
      <div id="doneCount" style="font-size:15px;font-weight:800;color:#075a43">مکمل: 0</div>
    </div>
    <div class="arabic" id="arabic"></div>
    <div class="translation" id="translation"></div>
  </main>

  <div class="status" id="status">🎙️ بول کر پڑھیں یا 🔊 سنیں</div>
  <div class="buttons">
    <button class="start" id="start">🎙️ بول کر پڑھیں</button>
    <button class="listen" id="listen">🔊 سنیں</button>
    <button class="next" id="next">اگلا ➜</button>
    <button id="reset">↻ ری سیٹ</button>
  </div>
</div></div>


<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

const ITEMS=[{"type": "ذکر", "no": 1, "arabic": "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ سُبْحَانَ اللَّهِ الْعَظِيمِ", "translation": "اللہ پاک ہے اور اسی کی حمد ہے، اللہ بہت پاک ہے۔", "target": 100}, {"type": "ذکر", "no": 2, "arabic": "سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَاللَّهُ أَكْبَرُ", "translation": "اللہ پاک ہے، تمام تعریفیں اللہ کے لیے ہیں، اور اللہ سب سے بڑا ہے۔", "target": 100}, {"type": "ذکر", "no": 3, "arabic": "لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ الْعَلِيِّ الْعَظِيمِ", "translation": "کوئی طاقت اور قوت نہیں اللہ کے سوا، جو بلند اور بہت بڑا ہے۔", "target": 100}, {"type": "ذکر", "no": 4, "arabic": "لَا إِلٰهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ", "translation": "اے اللہ کے سوا کوئی معبود نہیں، تو پاک ہے، میں واقعی ظالموں میں سے ہوں۔", "target": 100}, {"type": "ذکر", "no": 5, "arabic": "حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ", "translation": "اللہ ہمارے لیے کافی ہے، اور وہ بہترین کارساز ہے۔", "target": 100}, {"type": "ذکر", "no": 6, "arabic": "يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ", "translation": "اے ہمیشہ زندہ اور قائم رہنے والے! میں تیری رحمت کا طلبگار ہوں۔", "target": 100}, {"type": "ذکر", "no": 7, "arabic": "أَسْتَغْفِرُ اللَّهَ رَبِّي مِنْ كُلِّ ذَنْبٍ وَأَتُوبُ إِلَيْهِ", "translation": "میں اپنے رب اللہ سے ہر گناہ کی بخشش مانگتا ہوں اور اس کی طرف رجوع کرتا ہوں۔", "target": 100}, {"type": "ذکر", "no": 8, "arabic": "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ", "translation": "اللہ پاک ہے اور اسی کی حمد ہے، اس کی مخلوق کی گنتی کے برابر، اس کی رضا کے برابر، اس کے عرش کے وزن کے برابر، اور اس کے کلمات کی سیاہی کے برابر۔", "target": 5}, {"type": "ذکر", "no": 9, "arabic": "لَا إِلٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ", "translation": "اللہ کے سوا کوئی معبود نہیں، وہ اکیلا ہے، اس کا کوئی شریک نہیں، اس کا بادشاہت ہے، اس کی حمد ہے، اور وہ ہر چیز پر قادر ہے۔", "target": 5}, {"type": "ذ function norm(s){
 return s.replace(/[ًٌٍَُِّْـ]/g,"").replace(/[إأآٱ]/g,"ا").replace(/ى/g,"ی").replace(/ة/g,"ه").replace(/ؤ/g,"و").replace(/ئ/g,"ی").replace(/[^\u0600-\u06FF\s]/g," ").replace(/\s+/g," ").trim();
}
function same(a,b){
 a=norm(a);b=norm(b);
 return a===b || (a.length>2&&b.length>2&&(a.includes(b)||b.includes(a)));
}
function escapeHtml(s){
 return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

/* Save ONE completed reading to Firebase.
   Path:
   azkarStats/{uid}/profile
   azkarStats/{uid}/items/{itemKey}
   azkarStats/{uid}/totalReadings
*/
function saveReadingToFirebase(item){
 if(!currentUser)return Promise.resolve();
 const uid=String(currentUser.uid);
 const key=String(item.type==="ذکر" ? "zikr_"+item.no : "asma_"+item.no);
 const now=Date.now();
 const root=db.ref("azkarStats/"+uid);
 const updates={};
 updates["profile/name"]=currentUser.displayName||currentUser.email||"صارف";
 updates["profile/email"]=currentUser.email||"";
 updates["profile/lastSeen"]=firebase.database.ServerValue.TIMESTAMP;
 updates["profile/updatedAt"]=firebase.database.ServerValue.TIMESTAMP;
 updates["totalReadings"]=firebase.database.ServerValue.increment(1);
 updates["items/"+key+"/name"]=item.type==="ذکر" ? ("ذکر "+item.no) : ("اسماء الحسنیٰ "+item.no);
 updates["items/"+key+"/arabic"]=item.arabic;
 updates["items/"+key+"/count"]=firebase.database.ServerValue.increment(1);
 updates["items/"+key+"/lastReadAt"]=firebase.database.ServerValue.TIMESTAMP;
 updates["lastReadAt"]=firebase.database.ServerValue.TIMESTAMP;
 updates["daily/"+new Date().toISOString().slice(0,10)]=firebase.database.ServerValue.increment(1);
 return root.update(updates).then(()=>{
   myLifetimeTotal++;
   updateMyTotal();
 }).catch(err=>{
   console.warn("Firebase reading save failed",err);
 });
}

function updateMyTotal(){
 const el=$("myTotal");
 if(el){
   el.style.display=currentUser?"inline-block":"none";
   el.textContent="میری کل تلاوت: "+myLifetimeTotal;
 }
}

function loadMyStats(){
 if(!currentUser){
   myLifetimeTotal=0;updateMyTotal();return;
 }
 db.ref("azkarStats/"+currentUser.uid+"/totalReadings").once("value")
   .then(s=>{myLifetimeTotal=Number(s.val()||0);updateMyTotal()})
   .catch(()=>updateMyTotal());
}

 const box=$("leaderboard");
 if(!box)return;
 if(leaderListener){leaderListener();leaderListener=null;}
 const ref=db.ref("azkarStats");
 const handler=snap=>{
   const rows=[];
   snap.forEach(u=>{
     const v=u.val()||{};
     const total=Number(v.totalReadings||0);
     if(total>0){
       rows.push({
         name:(v.profile&&v.profile.name)||"صارف",
         total
       });
     }
   });
   rows.sort((a,b)=>b.total-a.total);
   const top=rows.slice(0,10);
   if(!top.length){
     box.innerHTML='<div style="font-size:12px;color:#68756e">ابھی کوئی reading محفوظ نہیں ہوئی۔</div>';
     return;
   }
   box.innerHTML=top.map((r,i)=>
     `<div class="leaderRow"><span class="leaderName">${i+1}. ${escapeHtml(r.name)}</span><span class="leaderCount">${r.total} مرتبہ</span></div>`
   ).join("");
 };
 ref.on("value",handler,()=>{box.innerHTML='<div style="font-size:12px;color:#a33">Leaderboard لوڈ نہیں ہو سکا۔</div>';});
 leaderListener=()=>ref.off("value",handler);
}

function complete(){
 if(locked)return;
 locked=true;
 const item=ITEMS[current];

 counts[current]=Math.min(counts[current]+1,item.target);
 $("targetTop").textContent=Math.max(0,item.target-counts[current])+" مرتبہ باقی";
 $("doneCount").textContent="مکمل: "+counts[current];

 // Completed attempt is fully green.
 document.querySelectorAll(".word").forEach(el=>{
   el.classList.remove("current");
   el.classList.add("done");
 });

 saveReadingToFirebase(item).finally(()=>{
   if(counts[current]>=item.target){
     $("status").textContent="🎉 ہدف مکمل — اگلا ذکر خود کھل رہا ہے…";
     setTimeout(()=>{
       if(current<ITEMS.length-1){
         current++;
         render();
         $("status").textContent="➡️ اگلا ذکر شروع کریں";
       }else{
         $("status").textContent="🌟 تمام اذکار مکمل ہوگئے۔";
       }
       locked=false;
       speechBuffer="";
     },700);
   }else{
     $("status").textContent="✅ reading مکمل — دوبارہ پڑھیں";
     locked=false;
     speechBuffer="";
     clearHighlight();
     paint();
   }
 });
}

function processText(t){
 const text=String(t||"").trim();
 if(!text || locked)return;

 // Green progress is only visual; counting does not require exact words.
 const got=norm(text).split(/\s+/).filter(Boolean);
 for(const token of got){
   if(pos>=words.length)break;
   if(same(token,words[pos])){
     pos++;
   }else{
     for(let j=pos+1;j<Math.min(pos+7,words.length);j++){
       if(same(token,words[j])){
         pos=j+1;
         break;
       }
     }
   }
 }
 paint();

 // Any non-empty final voice result counts as one reading, even if pronunciation
 // or recognition is imperfect. A short debounce joins split recognition results.
 speechBuffer += " " + text;
 if(countTimer)clearTimeout(countTimer);
 countTimer=setTimeout(()=>{
   if(!locked && speechBuffer.trim()){
     speechBuffer="";
     complete();
   }
 },700);
}

function startVoice(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){
   $("status").textContent="❌ اس براؤزر میں Voice Recognition دستیاب نہیں۔ Chrome استعمال کریں۔";
   return;
 }
 // Login is NOT required to count a reading.
 if(keep)return;

 keep=true;
 speechBuffer="";
 if(countTimer)clearTimeout(countTimer);
 $("start").textContent="⏹️ Listening بند کریں";
 $("status").textContent="🎙️ سن رہا ہوں… اب ذکر پڑھیں";
 clearHighlight();
 paint();

 const makeRecognition=()=>{
   if(!keep)return;

   rec=new SR();
   rec.lang="ar-SA";
   rec.continuous=true;
   rec.interimResults=false;
   rec.maxAlternatives=5;

   rec.onresult=e=>{
     let text="";
     for(let i=e.resultIndex;i<e.results.length;i++){
       if(e.results[i].isFinal){
         text+=" "+(e.results[i][0]?.transcript||"");
       }
     }
     if(text.trim())processText(text);
   };

   rec.onerror=e=>{
     if(e.error==="not-allowed" || e.error==="service-not-allowed"){
       keep=false;
       if(countTimer)clearTimeout(countTimer);
       $("start").textContent="🎙️ بول کر پڑھیں";
       $("status").textContent="❌ مائیک کی اجازت دیں۔";
       paint();
     }
   };

   rec.onend=()=>{
     rec=null;
     if(keep){
       clearTimeout(recognitionRestartTimer);
       recognitionRestartTimer=setTimeout(makeRecognition,250);
     }
   };

   try{
     rec.start();
   }catch(e){
     if(keep){
       clearTimeout(recognitionRestartTimer);
       recognitionRestartTimer=setTimeout(makeRecognition,500);
     }
   }
 };

 makeRecognition();
}

function stopVoice(){
 keep=false;
 if(countTimer)clearTimeout(countTimer);
 if(recognitionRestartTimer)clearTimeout(recognitionRestartTimer);
 speechBuffer="";
 if(rec){
   try{rec.onend=null;rec.stop();}catch(e){}
 }
 rec=null;
 $("start").textContent="🎙️ بول کر پڑھیں";
 $("status").textContent="Listening بند ہے۔";
 clearHighlight();
 paint();
}


function speakCurrent(){
 if(!("speechSynthesis"in window)){$("status").textContent="❌ Speaker دستیاب نہیں۔";return;}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(ITEMS[current].arabic);
 u.lang="ar-SA";u.rate=.72;
 u.onstart=()=>$("status").textContent="🔊 سنایا جا رہا ہے…";
 u.onend=()=>$("status").textContent="🔊 مکمل۔ اب خود پڑھیں۔";
 speechSynthesis.speak(u);
}

$("backBtn").onclick=()=>{ stopVoice(); window.location.href="index.html"; };
$("start").onclick=()=>keep?stopVoice():startVoice();
$("listen").onclick=speakCurrent;
$("next").onclick=()=>{
 if(current<ITEMS.length-1){
   current++;render();$("status").textContent="➡️ اگلا ذکر";
 }
};
$("reset").onclick=()=>{
 stopVoice();
 if(countTimer)clearTimeout(countTimer);
 speechBuffer="";
 counts=ITEMS.map(()=>0);
 current=0;
 locked=false;
 pos=0;
 render();
 $("status").textContent="↻ موجودہ session ری سیٹ ہوگیا۔ محفوظ شدہ کل data حذف نہیں ہوا۔";
};

auth.onAuthStateChanged(user=>{
 currentUser=user||null;
 const state=$("loginState");
 if(user){
   const name=user.displayName||user.email||"صارف";
   state.innerHTML="👤 "+escapeHtml(name)+"<br><span style='font-size:12px'>آپ کی readings محفوظ ہو رہی ہیں۔</span>";
   db.ref("users/"+user.uid).update({
     name:user.displayName||user.email||"صارف",
     email:user.email||"",
     lastSeen:firebase.database.ServerValue.TIMESTAMP
   }).catch(()=>{});
   loadMyStats();
   loadLeaderboard();
 }else{
   state.innerHTML="🔐 لاگ اِن نہیں ہے — reading شمار تو ہوگی مگر محفوظ نہیں ہوگی۔";
   myLifetimeTotal=0;updateMyTotal();
   loadLeaderboard();
 }
});

render();
loadLeaderboard();

</script>
