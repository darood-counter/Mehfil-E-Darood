.top{
 height:158px;position:relative;overflow:hidden;

// Keep the Azkar page awake for the whole time it is visible.
// Native Screen Wake Lock is the primary method. We request it on page load
// and again after any user interaction because some Android browsers require
// a user gesture before allowing a screen wake lock.
let pageKeepAwake=true;
let wakeLock=null;
let wakeRetryTimer=null;

async function requestWakeLock(){
  if(!pageKeepAwake || document.visibilityState!=="visible") return false;
  if(!navigator.wakeLock || !navigator.wakeLock.request) return false;
  if(wakeLock && !wakeLock.released) return true;
  try{
    wakeLock=await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release",()=>{
      wakeLock=null;
      if(pageKeepAwake && document.visibilityState==="visible") scheduleWakeRetry();
    },{once:true});
    return true;
  }catch(e){
    wakeLock=null;
    return false;
  }
}

function scheduleWakeRetry(){
  if(wakeRetryTimer) clearTimeout(wakeRetryTimer);
  wakeRetryTimer=setTimeout(()=>{
    wakeRetryTimer=null;
    requestWakeLock();
  },1000);
}

function keepScreenAwake(){
  if(!pageKeepAwake || document.visibilityState!=="visible") return;
  requestWakeLock().then(ok=>{
    if(!ok) scheduleWakeRetry();
  });
}

document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible") keepScreenAwake();
});
window.addEventListener("focus",keepScreenAwake);
window.addEventListener("load",keepScreenAwake);

// Important: retry immediately after a real user gesture. This is what makes
// it work on Android browsers that reject an automatic request on page load.
["pointerdown","touchstart","click"].forEach(ev=>{
  document.addEventListener(ev,()=>keepScreenAwake(),{passive:true});
});

// If Android/browser releases the lock while the page is still visible,
// periodically request it again.
setInterval(()=>{
  if(pageKeepAwake && document.visibilityState==="visible" && (!wakeLock || wakeLock.released)) keepScreenAwake();
},5000);

function norm(s){
 return s.replace(/[ًٌٍَُِّْـ]/g,"").replace(/[إأآٱ]/g,"ا").replace(/ى/g,"ی").replace(/ة/g,"ه").replace(/ؤ/g,"و").replace(/ئ/g,"ی").replace(/[^\u0600-\u06FF\s]/g," ").replace(/\s+/g," ").trim();
}
function same(a,b){
 a=norm(a);b=norm(b);
 return a===b || (a.length>2&&b.length>2&&(a.includes(b)||b.includes(a)));
}
function escapeHtml(s){
 return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function render(){
 const x=ITEMS[current];
 $("kind").textContent=x.type;
 $("translation").textContent=x.translation || "";
 $("targetTop").textContent=Math.max(0,x.target-counts[current])+" مرتبہ باقی";
 const clean=x.arabic.trim().split(/\s+/);
 $("arabic").innerHTML=clean.map((w,i)=>`<span class="word" id="w${i}">${w}</span>`).join(" ");
 words=clean.map(norm);pos=0;
 $("next").disabled=current===ITEMS.length-1;
 $("status").textContent="➡️ موجودہ ذکر پڑھیں";
}
function paint(){
 document.querySelectorAll(".word").forEach((el,i)=>{
   el.classList.toggle("done",i<pos);
   el.classList.toggle("current",i===pos && keep);
 });
}
function clearHighlight(){
 pos=0;
 document.querySelectorAll(".word").forEach(el=>{
   el.classList.remove("done","current");
 });
}


/* Save ONE completed reading to Firebase.
   Path:
   azkarStats/{uid}/profile
   azkarStats/{uid}/items/{itemKey}
   azkarStats/{uid}/totalReadings
*/
function saveReadingToFirebase(item){
 if(!currentUser)return Promise.resolve();
 const uid=String(currentUser.uid);
 const key=String(item.type==="ذکر" ? "zikr_"+item.no : "asma_"+item.no);
 const now=Date.now();
 const root=db.ref("azkarStats/"+uid);
 const updates={};
 updates["profile/name"]=currentUser.displayName||currentUser.email||"صارف";
 updates["profile/email"]=currentUser.email||"";
 updates["profile/lastSeen"]=firebase.database.ServerValue.TIMESTAMP;
 updates["profile/updatedAt"]=firebase.database.ServerValue.TIMESTAMP;
 updates["totalReadings"]=firebase.database.ServerValue.increment(1);
 updates["items/"+key+"/name"]=item.type==="ذکر" ? ("ذکر "+item.no) : ("اسماء الحسنیٰ "+item.no);
 updates["items/"+key+"/arabic"]=item.arabic;
 updates["items/"+key+"/count"]=firebase.database.ServerValue.increment(1);
 updates["items/"+key+"/lastReadAt"]=firebase.database.ServerValue.TIMESTAMP;
 updates["lastReadAt"]=firebase.database.ServerValue.TIMESTAMP;
 updates["daily/"+new Date().toISOString().slice(0,10)]=firebase.database.ServerValue.increment(1);
 return root.update(updates).then(()=>{
   myLifetimeTotal++;
   updateMyTotal();
 }).catch(err=>{
   console.warn("Firebase reading save failed",err);
 });
}

function updateMyTotal(){
 const el=$("myTotal");
 if(el){
   el.style.display=currentUser?"inline-block":"none";
   el.textContent="میری کل تلاوت: "+myLifetimeTotal;
 }
}

function loadMyStats(){
 if(!currentUser){
   myLifetimeTotal=0;updateMyTotal();return;
 }
 db.ref("azkarStats/"+currentUser.uid+"/totalReadings").once("value")
   .then(s=>{myLifetimeTotal=Number(s.val()||0);updateMyTotal()})
   .catch(()=>updateMyTotal());
}

function loadLeaderboard(){
 const box=$("leaderboard");
 if(!box)return;
 if(leaderListener){leaderListener();leaderListener=null;}
 const ref=db.ref("azkarStats");
 const handler=snap=>{
   const rows=[];
   snap.forEach(u=>{
     const v=u.val()||{};
     const total=Number(v.totalReadings||0);
     if(total>0){
       rows.push({
         name:(v.profile&&v.profile.name)||"صارف",
         total
       });
     }
   });
   rows.sort((a,b)=>b.total-a.total);
   const top=rows.slice(0,10);
   if(!top.length){
     box.innerHTML='<div style="font-size:12px;color:#68756e">ابھی کوئی reading محفوظ نہیں ہوئی۔</div>';
     return;
   }
   box.innerHTML=top.map((r,i)=>
     `<div class="leaderRow"><span class="leaderName">${i+1}. ${escapeHtml(r.name)}</span><span class="leaderCount">${r.total} مرتبہ</span></div>`
   ).join("");
 };
 ref.on("value",handler,()=>{box.innerHTML='<div style="font-size:12px;color:#a33">Leaderboard لوڈ نہیں ہو سکا۔</div>';});
 leaderListener=()=>ref.off("value",handler);
}

function playCompletionFeedback(){
 try{
   if(navigator.vibrate) navigator.vibrate([45,35,45]);
 }catch(e){}
 try{
   const AC=window.AudioContext||window.webkitAudioContext;
   if(!AC)return;
   const ctx=window.__azkarAudioCtx||(window.__azkarAudioCtx=new AC());
   if(ctx.state==='suspended')ctx.resume().catch(()=>{});
   const now=ctx.currentTime;
   const osc=ctx.createOscillator();
   const gain=ctx.createGain();
   osc.type='sine';
   osc.frequency.setValueAtTime(720,now);
   osc.frequency.setValueAtTime(880,now+0.07);
   gain.gain.setValueAtTime(0.0001,now);
   gain.gain.exponentialRampToValueAtTime(0.055,now+0.012);
   gain.gain.exponentialRampToValueAtTime(0.0001,now+0.16);
   osc.connect(gain); gain.connect(ctx.destination);
   osc.start(now); osc.stop(now+0.17);
 }catch(e){}
}

function saveLocalProgress(){
  try{
    localStorage.setItem("azkarProgress_v2",JSON.stringify({current,counts}));
  }catch(e){}
}

function loadLocalProgress(){
  try{
    const raw=localStorage.getItem("azkarProgress_v2");
    if(!raw)return;
    const data=JSON.parse(raw)||{};
    if(Array.isArray(data.counts)){
      counts=ITEMS.map((item,i)=>Math.max(0,Math.min(Number(data.counts[i])||0,item.target)));
    }
    if(Number.isInteger(data.current)){
      current=Math.max(0,Math.min(data.current,ITEMS.length-1));
    }
  }catch(e){}
}

function complete(){
  if(locked)return;
  locked=true;
  playCompletionFeedback();
  const item=ITEMS[current];
  const itemIndex=current;

  counts[itemIndex]=Math.min(counts[itemIndex]+1,item.target);
  saveLocalProgress();
  resetMode=false;
  $("targetTop").textContent=Math.max(0,item.target-counts[itemIndex])+" مرتبہ باقی";
  $("doneCount").textContent="مکمل: "+counts[itemIndex];

  document.querySelectorAll(".word").forEach(el=>{
    el.classList.remove("current");
    el.classList.add("done");
  });

  // Firebase saving must never block the voice/counting system.
  saveReadingToFirebase(item).catch(()=>{});

  if(counts[itemIndex]>=item.target){
    $("status").textContent="🎉 ہدف مکمل — اگلا ذکر خود کھل رہا ہے…";
    keep=false;
    if(rec){try{rec.onend=null;rec.stop();}catch(e){}}
    rec=null;
    setTimeout(()=>{
      if(current===itemIndex){
        if(current<ITEMS.length-1){
          current++;
          render();
          $("status").textContent="🎙️ اگلا ذکر سن رہا ہوں… اب پڑھیں";
          setTimeout(()=>startVoice(),120);
        }else{
          $("status").textContent="🌟 تمام اذکار مکمل ہوگئے۔";
        }
      }
      locked=false;
      speechBuffer="";
    },700);
  }else{
    $("status").textContent="✅ reading مکمل — دوبارہ پڑھیں";
    locked=false;
    speechBuffer="";
    clearHighlight();
    paint();
  }
}

function processText(t){
 const text=String(t||"").trim();
 if(!text || locked)return;

 // Recognition is intentionally flexible: the spoken Arabic does NOT have
 // to exactly match the displayed Arabic words. However, Arabic speech is
 // required. We count only tokens containing Arabic letters and ignore
 // Urdu/English/numbers/noise. Every N Arabic words = 1 reading, where N is
 // the number of Arabic words in the current zikr.
 const tokens=norm(text).split(/\s+/).filter(Boolean);
 const arabicTokens=tokens.filter(token=>/[\u0600-\u06FF]/.test(token));
 if(!arabicTokens.length)return;

 pos=Math.min(words.length, pos+arabicTokens.length);
 paint();

 if(pos>=words.length){
   // One complete group of the current zikr's Arabic-word count = one count.
   speechBuffer="";
   if(countTimer)clearTimeout(countTimer);
   complete();
 }
}

function startVoice(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){
   $("status").textContent="❌ اس براؤزر میں Voice Recognition دستیاب نہیں۔ Chrome استعمال کریں۔";
   return;
 }
 // Login is NOT required to count a reading.
 if(keep)return;

 keep=true;
 // Start both screen-awake mechanisms immediately from the user tap.
 keepScreenAwake();
 speechBuffer="";
 if(countTimer)clearTimeout(countTimer);
 $("start").textContent="⏹️ Listening بند کریں";
 $("status").textContent="🎙️ سن رہا ہوں… اب ذکر پڑھیں";
 clearHighlight();
 paint();

 const makeRecognition=()=>{
   if(!keep)return;

   rec=new SR();
   rec.lang="ar-SA";
   rec.continuous=true;
   rec.interimResults=false;
   rec.maxAlternatives=5;

   rec.onresult=e=>{
     let text="";
     for(let i=e.resultIndex;i<e.results.length;i++){
       if(e.results[i].isFinal){
         text+=" "+(e.results[i][0]?.transcript||"");
       }
     }
     if(text.trim())processText(text);
   };

   rec.onerror=e=>{
     if(e.error==="not-allowed" || e.error==="service-not-allowed"){
       keep=false;
              if(countTimer)clearTimeout(countTimer);
       $("start").textContent="🎙️ بول کر پڑھیں";
       $("status").textContent="❌ مائیک کی اجازت دیں۔";
       paint();
     }
   };

   rec.onend=()=>{
     rec=null;
     if(keep){
       clearTimeout(recognitionRestartTimer);
       recognitionRestartTimer=setTimeout(makeRecognition,250);
     }
   };

   try{
     rec.start();
   }catch(e){
     if(keep){
       clearTimeout(recognitionRestartTimer);
       recognitionRestartTimer=setTimeout(makeRecognition,500);
     }
   }
 };

 makeRecognition();
}

function stopVoice(){
 keep=false;
  // Do NOT release screen-awake protection: the page must stay awake even when not speaking.
 if(countTimer)clearTimeout(countTimer);
 if(recognitionRestartTimer)clearTimeout(recognitionRestartTimer);
 speechBuffer="";
 if(rec){
   try{rec.onend=null;rec.stop();}catch(e){}
 }
 rec=null;
 $("start").textContent="🎙️ بول کر پڑھیں";
 $("status").textContent="Listening بند ہے۔";
 clearHighlight();
 paint();
}


function speakCurrent(){
 if(!("speechSynthesis"in window)){$("status").textContent="❌ Speaker دستیاب نہیں۔";return;}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(ITEMS[current].arabic);
 u.lang="ar-SA";u.rate=.72;
 u.onstart=()=>$("status").textContent="🔊 سنایا جا رہا ہے…";
 u.onend=()=>$("status").textContent="🔊 مکمل۔ اب خود پڑھیں۔";
 speechSynthesis.speak(u);
}

$("backBtn").onclick=()=>{
  stopVoice();
  if(!resetMode) saveLocalProgress();
  window.location.href="index.html";
};
$("start").onclick=()=>keep?stopVoice():startVoice();
$("listen").onclick=speakCurrent;
$("next").onclick=()=>{
 if(current<ITEMS.length-1){
   current++;saveLocalProgress();resetMode=false;render();
   $("status").textContent="🎙️ اگلا ذکر سن رہا ہوں… اب پڑھیں";
   setTimeout(()=>startVoice(),120);
 }
};
$("reset").onclick=()=>{
 stopVoice();
 if(countTimer)clearTimeout(countTimer);
 speechBuffer="";
 // Reset only the current screen/session. Do NOT overwrite the last
 // saved progress, so the user's already-read amount can be resumed later.
 counts=ITEMS.map(()=>0);
 current=0;
 locked=false;
 pos=0;
 resetMode=true;
 render();
 $("status").textContent="↻ شروع سے — پچھلی محفوظ progress برقرار ہے۔";
};

auth.onAuthStateChanged(user=>{
 currentUser=user||null;
 const state=$("loginState");
 if(user){
   const name=user.displayName||user.email||"صارف";
   if(state) state.innerHTML="👤 "+escapeHtml(name)+"<br><span style='font-size:12px'>آپ کی readings محفوظ ہو رہی ہیں۔</span>";
   db.ref("users/"+user.uid).update({
     name:user.displayName||user.email||"صارف",
     email:user.email||"",
     lastSeen:firebase.database.ServerValue.TIMESTAMP
   }).catch(()=>{});
   loadMyStats();
   loadLeaderboard();
 }else{
   if(state) state.innerHTML="🔐 لاگ اِن نہیں ہے — reading شمار تو ہوگی مگر محفوظ نہیں ہوگی۔";
   myLifetimeTotal=0;updateMyTotal();
   loadLeaderboard();
 }
});

loadLocalProgress();
render();
loadLeaderboard();
setTimeout(()=>{ if(!keep && document.visibilityState==="visible") startVoice(); },350);
