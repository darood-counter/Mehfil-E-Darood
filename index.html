<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محفلِ درود - Mehfil-E-Darood</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      text-align: center;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h1 { color: #1b5e20; margin-bottom: 10px; }
    h2 { color: #2e7d32; }
    button {
      background-color: #2e7d32;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      margin: 5px;
      transition: background 0.3s;
    }
    button:hover { background-color: #1b5e20; }
    input[type="number"] {
      padding: 10px;
      width: 120px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      text-align: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }
    th { background-color: #2e7d32; color: white; }
    .hidden { display: none; }
    footer { margin-top: 30px; font-size: 14px; color: #777; }
  </style>
</head>
<body>

  <div class="container">
    <h1>محفلِ درود 🌸</h1>
    <p>درود پاک کا تحفہ بارگاہِ رسالت میں پیش کریں</p>

    <!-- Login Section -->
    <div id="authSection">
      <button id="loginBtn">Google کے ذریعے لاگ ان کریں</button>
    </div>

    <!-- User Info Section -->
    <div id="userInfo" class="hidden">
      <p>خوش آمدید، <b id="userName"></b>!</p>
      <div style="margin: 15px 0;">
        <input type="number" id="daroodCountInput" placeholder="تعداد درج کریں" min="1">
        <button id="addCountBtn">شامل کریں</button>
      </div>
      <p>آپ کی کل پڑھائی: <b id="userTotal">0</b></p>
    </div>

    <hr style="margin: 25px 0; border: 0; border-top: 1px solid #eee;">

    <!-- Leaderboard -->
    <h2>🏆 لائیو Leaderboard</h2>
    <table>
      <thead>
        <tr>
          <th>Rank</th>
          <th>صارف</th>
          <th>کل درود</th>
        </tr>
      </thead>
      <tbody id="board">
        <tr><td colspan="3">ڈیٹا لوڈ ہو رہا ہے...</td></tr>
      </tbody>
    </table>

    <footer>محفل درود – Contest Web App</footer>
  </div>

  <!-- Firebase SDKs (Compat Version) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyB3PjjiQM2IqKmIQJ4d4YOwcc10RiG47FI",
      authDomain: "mehfil-e-darood.firebaseapp.com",
      databaseURL: "https://mehfil-e-darood-default-rtdb.firebaseio.com",
      projectId: "mehfil-e-darood",
      storageBucket: "mehfil-e-darood.firebasestorage.app",
      messagingSenderId: "876052619750",
      appId: "1:876052619750:web:889b37737240756ba5f627",
      measurementId: "G-KFT3VXZM37"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let currentUser = null;

    const loginBtn = document.getElementById("loginBtn");
    const authSection = document.getElementById("authSection");
    const userInfo = document.getElementById("userInfo");
    const userNameDisplay = document.getElementById("userName");
    const userTotalDisplay = document.getElementById("userTotal");
    const daroodCountInput = document.getElementById("daroodCountInput");
    const addCountBtn = document.getElementById("addCountBtn");
    const boardTable = document.getElementById("board");

    // Google Login
    loginBtn.onclick = () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(error => {
        alert("لاگ ان نہیں ہو سکا: " + error.message);
      });
    };

    // Track Auth State
    auth.onAuthStateChanged(user => {
      if (user) {
        currentUser = user;
        authSection.classList.add("hidden");
        userInfo.classList.remove("hidden");
        userNameDisplay.innerText = user.displayName;

        // Fetch User Total
        db.ref("users/" + user.uid).on("value", snapshot => {
          const data = snapshot.val();
          userTotalDisplay.innerText = data ? (data.count || 0) : 0;
        });
      } else {
        currentUser = null;
        authSection.classList.remove("hidden");
        userInfo.classList.add("hidden");
      }
    });

    // Add Darood Count
    addCountBtn.onclick = () => {
      const val = parseInt(daroodCountInput.value);
      if (!val || val <= 0) {
        alert("براہ کرم درست تعداد درج کریں۔");
        return;
      }
      if (!currentUser) return;

      const userRef = db.ref("users/" + currentUser.uid);
      userRef.transaction(current => {
        if (current) {
          current.count = (current.count || 0) + val;
          current.name = currentUser.displayName;
        } else {
          current = { name: currentUser.displayName, count: val };
        }
        return current;
      }).then(() => {
        daroodCountInput.value = "";
      });
    };

    // Live Leaderboard
    db.ref("users").orderByChild("count").on("value", snapshot => {
      boardTable.innerHTML = "";
      let users = [];
      snapshot.forEach(child => {
        users.push(child.val());
      });
      users.reverse(); // Highest first

      if (users.length === 0) {
        boardTable.innerHTML = "<tr><td colspan='3'>ابھی تک کوئی ڈیٹا موجود نہیں ہے۔</td></tr>";
        return;
      }

      users.forEach((u, index) => {
        const row = `<tr>
          <td>${index + 1}</td>
          <td>${u.name || "گمنام"}</td>
          <td>${u.count || 0}</td>
        </tr>`;
        boardTable.innerHTML += row;
      });
    });
  </script>
</body>
</html>
