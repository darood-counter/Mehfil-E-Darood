<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسبیح اور آڈیو ایپ</title>
  <style>
    :root {
      --primary-color: #2e7d32;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      text-align: center;
      padding: 50px;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      display: inline-block;
    }
    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
    }
    button:hover {
      background-color: #1b5e20;
    }
    #statusMsg {
      margin-top: 20px;
      font-weight: bold;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>درود شریف آڈیو تسبیح</h2>
    <p>آڈیو سنیں اور خودکار طریقے سے کاؤنٹ میں اضافہ کریں</p>
    
    <!-- آڈیو پلے کرنے والا بٹن -->
    <button onclick="playYouTubeAudioOnly()">🔊 آڈیو سنیں (Listen)</button>
    
    <!-- اسٹیٹس یا میسج ظاہر کرنے کی جگہ -->
    <div id="statusMsg"></div>
  </div>

  <!-- یہاں فرضی یوٹیوب پلیئر اور فائر بیس کے لنکس یا ابجیکٹس فرض کیے گئے ہیں -->
  <script>
    // فرضی ابجیکٹس (آپ اپنے اصل پروجیکٹ والے ویری ایبلز استعمال کریں)
    let currentUser = { uid: "user123", displayName: "صارف" };
    let ytPlayer = {
      playVideo: function() { console.log("YouTube Video Playing..."); },
      seekTo: function(sec) { console.log("Seek to:", sec); }
    };
    
    // فرضی ڈیٹا بیس اور ساؤنڈ فنکشنز
    const db = {
      ref: function(path) {
        return {
          transaction: function(callback) {
            let currentData = { count: 5, name: "صارف" };
            let updated = callback(currentData);
            console.log("Firebase Updated Count:", updated.count);
          }
        };
      }
    };

    function playSuccessSound() {
      // کامیابی کی آواز کا کوڈ
    }

    function triggerVibration() {
      if (navigator.vibrate) {
        navigator.vibrate(50);
      }
    }

    // اصل فنکشن جو میسج کے بعد کاؤنٹ ایڈ کرتا ہے
    function playYouTubeAudioOnly() {
      if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
        try {
          ytPlayer.seekTo(0);
          ytPlayer.playVideo();
          
          playSuccessSound();
          triggerVibration();
          
          // اسٹیٹس میسج اور اس کے بعد کاؤنٹ میں اضافہ
          const statusMsg = document.getElementById("statusMsg");
          if(statusMsg) {
            statusMsg.style.color = "var(--primary-color)";
            statusMsg.innerText = "✓ درود شریف سننے پر 1 شمار (Count) شامل کر دیا گیا!";
            
            // میسج آنے کے فورا بعد فائر بیس میں 1 کاؤنٹ ایڈ ہو جائے گا
            if (currentUser) {
              const targetPath = "users/" + currentUser.uid;
              db.ref(targetPath).transaction(current => {
                if (current) { 
                  current.count = (current.count || 0) + 1; 
                  current.name = currentUser.displayName || currentUser.email; 
                } else { 
                  current = { name: currentUser.displayName || currentUser.email, count: 1 }; 
                }
                return current;
              });
            }

            setTimeout(() => { statusMsg.innerText = ""; }, 3000);
          }

        } catch(e) {
          alert("آڈیو پلے کرنے میں مسئلہ پیش آیا۔");
        }
      } else {
        alert("آڈیو لوڈ ہو رہی ہے، براہِ کرم ایک لمحہ انتظار کریں۔");
      }
    }
  </script>

</body>
</html>
