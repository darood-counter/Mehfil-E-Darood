<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mehfil-E-Darood — Final V7 (Admin Home)</title>
  <link href="https://fonts.googleapis.com/css2?family=Jameel+Noori+Nastaleeq&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #0d3b22;
      --primary-hover: #14532d;
      --accent-gold: #c5a059;
      --accent-gold-light: #fdf8ee;
      --bg-gradient: linear-gradient(145deg, #f3f7f4 0%, #e8f0ec 100%);
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #4b5563;
      --shadow: 0 12px 35px rgba(13, 59, 34, 0.08);
    }

    body {
      font-family: 'Jameel Noori Nastaleeq', 'Plus Jakarta Sans', sans-serif;
      background: #eef4f1;
      color: var(--text-main);
      text-align: center;
      margin: 0;
      padding-bottom: 70px;
      min-height: 100vh;
      font-size: 16px;
      line-height: 1.8;
    }

    .top-header {
      background: linear-gradient(135deg, #0b311c 0%, #134e29 100%);
      color: white;
      padding: 20px 16px 30px 16px;
      border-bottom-left-radius: 25px;
      border-bottom-right-radius: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin-bottom: -20px;
    }

    .brand-title {
      font-size: 28px;
      font-weight: bold;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #ffffff;
    }

    .brand-subtitle {
      font-size: 15px;
      color: #a3c1ad;
      margin-top: 4px;
    }

    .container {
      max-width: 620px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 30px 18px;
      border-radius: 24px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(197, 160, 89, 0.25);
      position: relative;
      z-index: 10;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      background-color: var(--accent-gold-light);
      color: var(--primary-color);
      border: 1px solid rgba(197, 160, 89, 0.4);
      padding: 3px 12px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .live-dot {
      height: 8px;
      width: 8px;
      background-color: #16a34a;
      border-radius: 50%;
      display: inline-block;
      margin-left: 6px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.7; }
    }

    /* Completed darood-card CSS */
    .darood-card {
      background: #fdfaf6;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(197, 160, 89, 0.2);
      text-align: right;
    }

    /* --- Profile & Password Form Styles --- */
    .profile-heading {
      font-size: 24px;
      color: var(--primary-color);
      border-bottom: 2px solid var(--accent-gold);
      display: inline-block;
      padding-bottom: 5px;
      margin-bottom: 20px;
      text-align: right;
    }

    .form-group {
      margin-bottom: 18px;
      text-align: right;
    }

    .form-group label {
      display: block;
      font-size: 18px;
      color: var(--text-main);
      margin-bottom: 8px;
      font-weight: bold;
    }

    .form-group input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 15px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-family: 'Plus Jakarta Sans', sans-serif; /* LTR font for passwords */
      font-size: 16px;
      direction: ltr; /* Password fields should always be LTR */
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(13, 59, 34, 0.15);
    }

    .btn-submit {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 20px;
      font-family: 'Jameel Noori Nastaleeq', sans-serif;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      transition: background 0.3s;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <div class="top-header">
    <h1 class="brand-title">محفلِ درود</h1>
    <div class="brand-subtitle">ایڈمن ہوم / ڈیش بورڈ</div>
  </div>

  <!-- Main Container -->
  <div class="container">
    <div class="live-badge">
      <span class="live-dot"></span>
      لائیو
    </div>

    <!-- Password Change Section -->
    <div style="text-align: right;">
      <h2 class="profile-heading">پروفائل کی ترتیبات</h2>
    </div>
    
    <div class="darood-card">
      <form action="#" method="POST">
        
        <div class="form-group">
          <label for="old_password">موجودہ پاسورڈ</label>
          <input type="password" id="old_password" name="old_password" placeholder="Old Password" required>
        </div>

        <div class="form-group">
          <label for="new_password">نیا پاسورڈ</label>
          <input type="password" id="new_password" name="new_password" placeholder="New Password" required>
        </div>

        <div class="form-group">
          <label for="confirm_password">نئے پاسورڈ کی تصدیق</label>
          <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm New Password" required>
        </div>

        <button type="submit" class="btn-submit">پاسورڈ تبدیل کریں</button>

      </form>
    </div>

  </div>

</body>
</html>
